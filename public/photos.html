<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            background-color: #010101;
        }

        #app {
            display: flex;
            flex-wrap: wrap;
        }

        .phone {
            width: 258px;
            height: 466px;
            border-right: 12px solid #2a2a2a;
            background-color: #2a2a2a;
            box-sizing: border-box;
            border-radius: 24px;
            margin: 8px 14px;
            break-inside: avoid;
        }

        .screen {
            width: 100%;
            height: 100%;
            border: 5px solid #686868;
            box-sizing: border-box;
            border-radius: 24px;
            background-color: #fff;
            /* shadow inset */
            box-shadow: inset 0 0 4px 4px rgba(0, 0, 0, 0.1);
        }

        .encoche {
            width: 132px;
            height: 18px;
            background-color: #686868;
            border-radius: 0 0 12px 12px;
            margin: 0 auto;
        }

        .logo {
            width: 22px;
            height: 22px;
            margin: 0 auto;
            display: block;
            margin-top: 3px;
            margin-bottom: 7px;
        }

        .photo {
            width: 226px;
            height: 350px;
            margin: 0 auto;
            background-size: cover;
            background-position: center;
            border-radius: 10px;
            position: relative;
            box-sizing: border-box;
            overflow: hidden;
        }

        .description {
            position: absolute;
            bottom: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 12px;
            box-sizing: border-box;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0.8) 0%, rgba(0, 0, 0, 0) 100%);
        }

        .name {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            display: flex;
            align-items: center;
            font-family: 'Outfit', sans-serif;
            text-shadow: 0 0 3px rgba(0, 0, 0, 0.3);
        }

        .age {
            font-size: 17px;
            font-weight: normal;
            color: #fff;
            margin-top: 2px;
        }

        .verified {
            width: 20px;
            height: 20px;
            margin-left: 5px;
            margin-top: 2px;
        }

        .info {
            width: 16px;
            height: 16px;
        }

        .buttons {
            width: 190px;
            height: 60px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin: 0 auto;
        }

        .buttons img {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            padding: 7px;
            box-shadow: 0 0 3px 1px rgba(0, 0, 0, 0.08);
        }

        .buttons img:nth-child(odd) {
            padding: 5px;
        }
    </style>
</head>

<body>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <div id="app">
        <div class="phone" v-for="membre of membres" :key="membre.name">
            <div class="screen">
                <div class="encoche"></div>
                <img src="./img/tinder.svg" alt="tinder" class="logo" />
                <div class="photo" :style="{ backgroundImage: 'url(' + membre.photo + ')' }">
                    <div class="description">
                        <span class="name">
                            {{ membre.name }},
                            <span class="age">
                                &nbsp;{{ membre.age }}
                            </span>
                            <img src="./img/check.svg" alt="verified" class="verified" />
                        </span>
                        <img src="./img/info.svg" alt="info" class="info" />
                    </div>
                </div>
                <div class="buttons">
                    <img v-for="icon of ['reload', 'x', 'star', 'heart', 'bolt'] " :src="'./img/' + icon + '.svg'"
                        :key="icon" :alt="icon" />
